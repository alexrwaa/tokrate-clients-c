name: Tokrate-CN Windows x64 portable

# Single Windows x64 job. The cross-platform sources stay in the tree; only the
# portable ZIP for Tokrate-CN is built and published here.
on:
  push:
    branches: [main, tokrate-cn]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

# Needed to publish the release and to force-push the ci-artifacts log branch.
permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  # Pull requests cancel each other; push runs must finish so their log reaches
  # ci-artifacts and their release is published.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI_LOG: ${{ github.workspace }}/.ci/ci.log
  CARGO_TERM_COLOR: always
  PYTHONIOENCODING: utf-8

jobs:
  portable:
    name: Windows x64 portable
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            desktop/core
            desktop/src-tauri
      - name: Prepare CI log
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/.ci"
          {
            echo "# Tokrate-CN portable build"
            echo "event: $GITHUB_EVENT_NAME"
            echo "ref: $GITHUB_REF"
            echo "sha: $GITHUB_SHA"
            echo "run: $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            echo "runner: $RUNNER_OS $RUNNER_ARCH"
            node --version || echo "node unavailable"
            npm --version || echo "npm unavailable"
            cargo --version || echo "cargo unavailable"
            rustc --version || echo "rustc unavailable"
            python --version || echo "python unavailable"
          } 2>&1 | tee -a "$CI_LOG"
      - name: Report WebView2 runtime
        shell: pwsh
        continue-on-error: true
        run: |
          $keys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $found = $false
          foreach ($key in $keys) {
            if (Test-Path $key) {
              $version = (Get-ItemProperty -Path $key -ErrorAction Stop).pv
              "WebView2 runtime detected: $version"
              Add-Content -LiteralPath $env:CI_LOG -Value "WebView2 runtime detected: $version"
              $found = $true
            }
          }
          if (-not $found) {
            "WebView2 runtime not detected in the registry (the portable build needs it at runtime)."
            Add-Content -LiteralPath $env:CI_LOG -Value "WebView2 runtime not detected in the registry."
          }
      - name: Install desktop dependencies
        shell: bash
        working-directory: desktop
        run: |
          set -o pipefail
          npm ci --ignore-scripts 2>&1 | tee -a "$CI_LOG"
      - name: Frontend unit tests
        shell: bash
        working-directory: desktop
        run: |
          set -o pipefail
          npm test 2>&1 | tee -a "$CI_LOG"
      - name: Build frontend bundle
        shell: bash
        working-directory: desktop
        run: |
          set -o pipefail
          npm run build 2>&1 | tee -a "$CI_LOG"
      - name: Core tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --manifest-path desktop/core/Cargo.toml -- --nocapture 2>&1 | tee -a "$CI_LOG"
      - name: Desktop crate tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --release --features custom-protocol --manifest-path desktop/src-tauri/Cargo.toml 2>&1 | tee -a "$CI_LOG"
      - name: Build release executable (no installer bundle)
        shell: bash
        working-directory: desktop
        run: |
          set -o pipefail
          npm run tauri -- build --features custom-protocol --no-bundle 2>&1 | tee -a "$CI_LOG"
      - name: Verify release executable
        shell: bash
        env:
          EXE: desktop/src-tauri/target/release/tokrate-desktop.exe
        run: |
          set -o pipefail
          if [ ! -f "$EXE" ]; then
            echo "Expected executable is missing: $EXE" | tee -a "$CI_LOG"
            exit 1
          fi
          ls -l "$EXE" 2>&1 | tee -a "$CI_LOG"
          sha256sum "$EXE" 2>&1 | tee -a "$CI_LOG"
      - name: Native webview smoke test
        shell: bash
        env:
          TOKRATE_SMOKE_DIAGNOSTIC: ${{ runner.temp }}/tokrate-native-smoke-win-x64.json
        run: |
          set -o pipefail
          python desktop/scripts/native-smoke.py desktop/src-tauri/target/release/tokrate-desktop.exe 2>&1 | tee -a "$CI_LOG"
      - name: Package portable archive
        id: package
        shell: bash
        run: |
          set -o pipefail
          node desktop/scripts/package-portable.mjs 2>&1 | tee -a "$CI_LOG"
      - name: Verify portable archive
        id: verify
        shell: bash
        run: |
          set -o pipefail
          python desktop/scripts/portable-verify.py dist/Tokrate-CN-Portable-win-x64.zip 2>&1 | tee -a "$CI_LOG"
      - name: Upload portable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tokrate-CN-Portable-win-x64-${{ github.run_number }}
          path: |
            dist/Tokrate-CN-Portable-win-x64.zip
            dist/Tokrate-CN-Portable-win-x64.zip.sha256
            dist/Tokrate-CN-Portable-manifest.json
            dist/portable-verify.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokrate-native-smoke-diagnostics-win-x64-${{ github.run_number }}
          path: ${{ runner.temp }}/tokrate-native-smoke-win-x64.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish portable release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: cn-portable-latest
        run: |
          set -o pipefail
          NOTES="$GITHUB_WORKSPACE/.ci/release-notes.md"
          mkdir -p "$GITHUB_WORKSPACE/.ci"
          printf '%s\n' \
            'Tokrate-CN 便携版 · Windows x64' \
            '' \
            '下载 `Tokrate-CN-Portable-win-x64.zip`，解压到任意可写目录即可使用，无需安装。' \
            '' \
            '- 解压后直接运行 `Tokrate-CN.exe`。' \
            '- 所有数据（设置、历史、WebView2 缓存）都保存在同目录的 `data/` 里，不写入 C 盘用户目录；删除文件夹即等于卸载。' \
            '- 需要系统已安装 WebView2 Runtime（Windows 11 自带；Windows 10 一般随 Edge 已安装）。' \
            '- 便携版不做自动更新：需要升级时重新下载本页的 ZIP 并覆盖 `Tokrate-CN.exe`，保留 `data/`。' \
            '- 校验文件：`Tokrate-CN-Portable-win-x64.zip.sha256`。' \
            '' \
            "构建：$GITHUB_SHA · run $GITHUB_RUN_ID" > "$NOTES"
          cat "$NOTES" | tee -a "$CI_LOG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title 'Tokrate-CN 便携版（Windows x64）' \
              --notes-file "$NOTES"
          else
            gh release create "$TAG" \
              --title 'Tokrate-CN 便携版（Windows x64）' \
              --notes-file "$NOTES" \
              --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" \
            dist/Tokrate-CN-Portable-win-x64.zip \
            dist/Tokrate-CN-Portable-win-x64.zip.sha256 \
            --clobber 2>&1 | tee -a "$CI_LOG"
          echo "release updated: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" | tee -a "$CI_LOG"
      # Runs even when the build failed, so the failure reason and test output are
      # readable from the ci-artifacts branch without downloading artifacts.
      - name: Publish CI log to ci-artifacts branch
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if [ ! -d .git ]; then
            echo "No checkout; skipping log publication."
            exit 0
          fi
          if [ ! -f "$CI_LOG" ]; then
            echo "No CI log written; skipping log publication."
            exit 0
          fi
          echo "=== job status: ${{ job.status }} ===" >> "$CI_LOG"
          echo "=== package outcome: ${{ steps.package.outcome }} / verify outcome: ${{ steps.verify.outcome }} ===" >> "$CI_LOG"
          mkdir -p "$GITHUB_WORKSPACE/.ci"
          cp "$CI_LOG" "$GITHUB_WORKSPACE/.ci/log-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .ci
          git commit -m "ci: portable build log $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT [skip ci]"
          gh auth setup-git
          git push --force origin "HEAD:ci-artifacts"
